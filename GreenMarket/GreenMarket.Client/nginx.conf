server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NB : les types MIME (dont application/wasm) viennent de /etc/nginx/mime.types
    # inclus par défaut. Ne PAS redéclarer un bloc `types {}` ici : il écraserait
    # toute la table et casserait les .js/.json (servis en octet-stream).

    # Force l'environnement Blazor sur Production
    # => le client charge wwwroot/appsettings.Production.json (URLs reesch.com)
    add_header Blazor-Environment "Production";

    # Fallback SPA : toute route inconnue renvoie index.html
    # (sinon un refresh sur /catalogue renvoie un 404)
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Bootstrap Blazor NON fingerprintés : dotnet.js et blazor.webassembly.js
    # portent le manifeste qui référence les assemblies fingerprintées. S'ils sont
    # mis en cache "immutable", le navigateur (et Cloudflare) garde un ancien manifeste
    # pointant vers d'anciennes .wasm => le nouveau déploiement n'est jamais pris.
    # Ils doivent donc être revalidés à chaque chargement.
    # (Regex prioritaire sur le préfixe /_framework/ ci-dessous.)
    location ~* /_framework/(dotnet|blazor\.webassembly)\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Les autres assets du framework sont fingerprintés (hash dans le nom) :
    # cache long immutable sans risque.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ne pas mettre en cache la config ni la page d'entrée
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~* /appsettings.*\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
