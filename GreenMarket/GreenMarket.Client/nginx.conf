server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NB : les types MIME (dont application/wasm) viennent de /etc/nginx/mime.types
    # inclus par défaut. Ne PAS redéclarer un bloc `types {}` ici : il écraserait
    # toute la table et casserait les .js/.json (servis en octet-stream).

    # Force l'environnement Blazor sur Production
    # => le client charge wwwroot/appsettings.Production.json (URLs reesch.com)
    add_header Blazor-Environment "Production";

    # Fallback SPA : toute route inconnue renvoie index.html
    # (sinon un refresh sur /catalogue renvoie un 404)
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Les assets versionnés du framework peuvent être mis en cache longtemps
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ne pas mettre en cache la config ni la page d'entrée
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~* /appsettings.*\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
