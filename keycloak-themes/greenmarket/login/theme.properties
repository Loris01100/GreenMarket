# Thème de login GreenMarket — rebrand CSS par-dessus le thème moderne de Keycloak.
# On hérite de keycloak.v2 (PatternFly v5) et on ajoute uniquement nos overrides.
parent=keycloak.v2
import=common/keycloak

# css/styles.css est résolu depuis le parent (look par défaut),
# css/greenmarket.css est notre surcouche de branding.
styles=css/styles.css css/greenmarket.css
